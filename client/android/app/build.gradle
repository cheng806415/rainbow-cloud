plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def flutterVersionCode = '1'
def flutterVersionName = '1.0.0'

android {
    namespace "com.rainbow.cloud"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.rainbow.cloud"
        // 提升到 23 以启用 flutter_secure_storage 9.x 的 EncryptedSharedPreferences
        // 原 minSdk 21 在 Android 6.0 以下缺少 EncryptedSharedPreferences 支持
        minSdkVersion 23
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
