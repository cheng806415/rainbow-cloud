<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>倒计时</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#000;font-family:"Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column}
.header{background:#fff;padding:15px 30px;border-bottom:2px solid #000;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:20px;color:#000;letter-spacing:2px}
.header a{color:#666;text-decoration:none;font-size:14px}
.header a:hover{color:#000}
.main{flex:1;display:flex;justify-content:center;align-items:center;padding:40px 20px;position:relative}
.config-section{border:2px solid #000;padding:30px;max-width:500px;width:100%}
.config-section h2{border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:25px;font-size:18px;letter-spacing:2px}
.form-group{margin-bottom:18px;text-align:left}
.form-group label{display:block;font-size:14px;margin-bottom:6px;font-weight:bold;letter-spacing:1px}
.form-row{display:flex;gap:10px;align-items:center}
.form-row>*{flex:1}
.form-row select,.form-row input[type=number]{width:100%;padding:8px;border:2px solid #000;font-size:14px;outline:none;font-family:"Microsoft YaHei",sans-serif;background:#fff}
.form-row select:hover{background:#f5f5f5}
.time-row select{width:80px;padding:10px;font-size:16px;border:2px solid #000;background:#fff;outline:none;font-family:"Microsoft YaHei",sans-serif;text-align:center;cursor:pointer;-webkit-appearance:none;appearance:none}
.time-row select:hover{background:#f5f5f5}
.time-row{display:flex;gap:8px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.time-row.col{flex-direction:column;align-items:stretch;max-width:260px;margin:0 auto}
.time-sep{font-size:24px;font-weight:bold;padding-bottom:2px}
.mode-toggle{display:flex;gap:0;margin-bottom:18px;border:2px solid #000}
.mode-toggle button{flex:1;background:#fff;color:#000;border:none;padding:10px;font-size:14px;cursor:pointer;font-family:"Microsoft YaHei",sans-serif;letter-spacing:1px;font-weight:bold;border-right:2px solid #000}
.mode-toggle button:last-child{border-right:none}
.mode-toggle button.active{background:#000;color:#fff}
.mode-toggle button:hover:not(.active){background:#f5f5f5}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.checkbox-row input[type=checkbox]{width:18px;height:18px;cursor:pointer}
.checkbox-row label{cursor:pointer;margin:0;font-weight:normal;font-size:14px}
.schedule-item{border:2px solid #000;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.schedule-item-info{flex:1;min-width:0}
.schedule-item-name{font-weight:bold;font-size:15px;margin-bottom:4px}
.schedule-item-time{font-size:12px;color:#666;font-family:monospace}
.schedule-item-actions{display:flex;gap:5px;flex-shrink:0}
.schedule-item-btn{background:#fff;color:#000;border:1px solid #000;padding:4px 10px;cursor:pointer;font-size:12px;font-family:"Microsoft YaHei",sans-serif}
.schedule-item-btn:hover{background:#000;color:#fff}
.schedule-item-btn.danger{border-color:#c00;color:#c00}
.schedule-item-btn.danger:hover{background:#c00;color:#fff}
.schedule-empty{text-align:center;color:#999;padding:20px;font-size:13px}
.btn{background:#000;color:#fff;border:none;padding:12px 30px;font-size:16px;cursor:pointer;width:100%;margin-top:10px;letter-spacing:2px;font-family:"Microsoft YaHei",sans-serif}
.btn:hover{background:#333}
.btn-outline{background:#fff;color:#000;border:2px solid #000;margin-top:8px}
.btn-outline:hover{background:#000;color:#fff}
.btn-sm{padding:8px 16px;font-size:14px;width:auto;letter-spacing:1px}
.countdown-display{position:absolute;transition:all 0.3s}
.countdown-time{font-weight:bold;font-family:monospace;letter-spacing:5px}
.status-badge{display:inline-block;padding:8px 20px;font-size:14px;margin-bottom:20px;letter-spacing:2px;font-weight:bold}
.status-wait{border:2px solid #000;color:#000}
.status-live{background:#000;color:#fff}
.exam-info{font-size:13px;color:#666;margin-bottom:8px}
.exam-info span{color:#000;font-weight:bold;font-size:14px}
.examing-timer{font-weight:bold;font-family:monospace}
.examing-timer.warn{animation:blink 1s infinite}
.examing-timer.danger{animation:blink 0.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.back-btn{position:fixed;top:60px;right:20px;background:#fff;color:#000;border:2px solid #000;padding:8px 16px;cursor:pointer;font-size:13px;font-family:"Microsoft YaHei",sans-serif}
.back-btn:hover{background:#000;color:#fff}
.settings-toggle{position:fixed;top:60px;right:140px;background:#fff;color:#000;border:2px solid #000;padding:8px 16px;cursor:pointer;font-size:13px;font-family:"Microsoft YaHei",sans-serif}
.settings-toggle:hover{background:#000;color:#fff}
.settings-panel{position:fixed;top:100px;right:20px;width:360px;max-height:calc(100vh - 120px);overflow-y:auto;background:#fff;border:2px solid #000;padding:20px;z-index:100;display:none}
.settings-panel h3{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:15px;font-size:15px;letter-spacing:1px}
.settings-panel .sg{margin-bottom:12px}
.settings-panel .sg label{display:block;font-size:12px;margin-bottom:4px;font-weight:bold;color:#666}
.settings-panel .sg input[type=number],.settings-panel .sg select{width:100%;padding:6px 8px;border:1px solid #ccc;font-size:13px;outline:none;font-family:"Microsoft YaHei",sans-serif}
.settings-panel .sg input[type=color]{width:40px;height:28px;border:1px solid #ccc;cursor:pointer}
.settings-panel .sg .row{display:flex;gap:8px;align-items:center}
.settings-panel .sg .row>div{flex:1}
.settings-panel .sg .row label{margin-bottom:2px}
.settings-panel .sg input[type=checkbox]{margin-right:6px}
.action-row{display:flex;gap:10px;margin-top:10px}
.action-row .btn{flex:1}
.ended-icon{font-size:60px;margin-bottom:15px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
  <h1>倒计时</h1>
  <a href="../nav/">功能导航</a>
</div>
<div class="main" id="main">
<div class="config-section" id="config">
  <h2>设置考试</h2>
  <div class="mode-toggle">
    <button id="modeStartBtn" class="active" onclick="switchMode('start')">设置开始时间</button>
    <button id="modeEndBtn" onclick="switchMode('end')">设置结束时间</button>
    <button id="modeScheduleBtn" onclick="switchMode('schedule')">考试日程</button>
  </div>

  <div class="form-group" id="startTimeGroup">
    <label>考试开始时间</label>
    <div class="time-row">
      <select id="hSelect" onchange="updateDurationDisplay()"></select>
      <div class="time-sep">:</div>
      <select id="mSelect" onchange="updateDurationDisplay()"></select>
      <div class="time-sep">:</div>
      <select id="sSelect" onchange="updateDurationDisplay()"></select>
    </div>
  </div>

  <div class="form-group" id="endTimeGroup" style="display:none">
    <label>考试结束时间</label>
    <div class="time-row">
      <select id="ehSelect" onchange="updateDurationDisplay()"></select>
      <div class="time-sep">:</div>
      <select id="emSelect" onchange="updateDurationDisplay()"></select>
      <div class="time-sep">:</div>
      <select id="esSelect" onchange="updateDurationDisplay()"></select>
    </div>
  </div>

  <div class="form-group" id="durationGroup">
    <label>考试时长（自动计算）</label>
    <div id="durationDisplay" style="padding:10px;border:2px solid #000;background:#f5f5f5;font-size:16px;font-weight:bold;text-align:center;font-family:monospace">--</div>
  </div>

  <div class="form-group" id="scheduleGroup" style="display:none">
    <label>考试日程</label>
    <div id="scheduleSummary" style="padding:10px;border:2px solid #000;background:#f5f5f5;font-size:13px;min-height:60px;margin-bottom:10px"></div>
    <button class="btn btn-outline" onclick="openScheduleEditor()">编辑日程</button>
    <button class="btn" style="margin-top:8px" onclick="startSchedule()">一键开始日程</button>
  </div>

  <button class="btn" id="startBtn" onclick="saveConfig()">开始计时</button>
</div>

<!-- 考试日程编辑界面 -->
<div class="config-section" id="scheduleEditor" style="display:none">
  <h2>考试日程</h2>
  <div id="scheduleList" style="margin-bottom:15px;max-height:50vh;overflow-y:auto"></div>
  <button class="btn" onclick="addScheduleItem()">添加科目</button>
  <button class="btn btn-outline" style="margin-top:8px" onclick="closeScheduleEditor()">返回</button>
</div>

<!-- 科目编辑界面 -->
<div class="config-section" id="itemEditor" style="display:none">
  <h2 id="itemEditorTitle">添加科目</h2>
  <div class="form-group">
    <label>科目名称</label>
    <input type="text" id="itemName" placeholder="例如：语文" style="width:100%;padding:10px;border:2px solid #000;font-size:14px;outline:none;font-family:'Microsoft YaHei',sans-serif">
  </div>
  <div class="form-group">
    <label>考试日期</label>
    <input type="date" id="itemDate" style="width:100%;padding:10px;border:2px solid #000;font-size:14px;outline:none;font-family:'Microsoft YaHei',sans-serif">
  </div>
  <div class="form-group">
    <label>开始时间</label>
    <div class="time-row">
      <select id="itemH" onchange="updateItemDuration()"></select>
      <div class="time-sep">:</div>
      <select id="itemM" onchange="updateItemDuration()"></select>
    </div>
  </div>
  <div class="form-group">
    <label>结束时间</label>
    <div class="time-row">
      <select id="itemEH" onchange="updateItemDuration()"></select>
      <div class="time-sep">:</div>
      <select id="itemEM" onchange="updateItemDuration()"></select>
    </div>
  </div>
  <div class="form-group">
    <label>考试时长（自动计算）</label>
    <div id="itemDuration" style="padding:10px;border:2px solid #000;background:#f5f5f5;font-size:16px;font-weight:bold;text-align:center;font-family:monospace">--</div>
  </div>
  <button class="btn" id="itemSaveBtn" onclick="saveScheduleItem()">保存科目</button>
  <button class="btn btn-outline" style="margin-top:8px" onclick="cancelItemEdit()">取消</button>
</div>
</div>
<div id="countdownDisplay" class="countdown-display" style="display:none;text-align:center"></div>
<button class="back-btn" id="backBtn" style="display:none" onclick="showConfig()">设置</button>
<button class="settings-toggle" id="settingsToggle" style="display:none" onclick="toggleSettings()">高级设置</button>
<div class="settings-panel" id="settingsPanel">
  <h3>高级设置</h3>
  <div class="sg">
    <label>主倒计时字体大小 (px)</label>
    <input type="number" id="ss_fontSize" min="20" max="300" value="120" onchange="applySettings()">
  </div>
  <div class="sg">
    <label>主倒计时颜色</label>
    <input type="color" id="ss_fontColor" value="#000000" onchange="applySettings()">
  </div>
  <div class="sg">
    <label>页面背景颜色</label>
    <input type="color" id="ss_bgColor" value="#ffffff" onchange="applySettings()">
  </div>
  <div class="sg">
    <label>显示位置</label>
    <select id="ss_position" onchange="applySettings()">
      <option value="center">居中</option>
      <option value="top">顶部</option>
      <option value="bottom">底部</option>
      <option value="top-left">左上</option>
      <option value="top-right">右上</option>
      <option value="bottom-left">左下</option>
      <option value="bottom-right">右下</option>
    </select>
  </div>
  <div class="sg">
    <label>水平偏移 (px)</label>
    <input type="number" id="ss_offsetX" value="0" onchange="applySettings()">
  </div>
  <div class="sg">
    <label>垂直偏移 (px)</label>
    <input type="number" id="ss_offsetY" value="0" onchange="applySettings()">
  </div>
  <div class="sg">
    <label>标签文字颜色</label>
    <input type="color" id="ss_labelColor" value="#666666" onchange="applySettings()">
  </div>
  <div class="sg">
    <label>等待中标签文字</label>
    <input type="text" id="ss_waitLabel" value="等待考试开始" onchange="applySettings()" style="padding:6px 8px;border:1px solid #ccc;font-size:13px">
  </div>
  <div class="sg">
    <label>考试中标签文字</label>
    <input type="text" id="ss_liveLabel" value="考试进行中" onchange="applySettings()" style="padding:6px 8px;border:1px solid #ccc;font-size:13px">
  </div>
  <div class="sg" style="border-top:1px solid #eee;padding-top:12px;margin-top:8px">
    <label style="margin-bottom:10px;font-size:13px;color:#333">显示控制</label>
    <div><input type="checkbox" id="ss_showWait" checked onchange="applySettings()"> 等待中状态显示</div>
    <div><input type="checkbox" id="ss_showLive" checked onchange="applySettings()"> 考试中状态显示</div>
    <div><input type="checkbox" id="ss_showTime" checked onchange="applySettings()"> 考试时间显示</div>
    <div><input type="checkbox" id="ss_showDur" checked onchange="applySettings()"> 考试时长显示</div>
    <div><input type="checkbox" id="ss_showElapsed" checked onchange="applySettings()"> 已用时显示</div>
    <div><input type="checkbox" id="ss_showEndTime" onchange="applySettings()"> 结束时间显示</div>
    <div><input type="checkbox" id="ss_showWarning" checked onchange="applySettings()"> 倒计时警告提示</div>
  </div>
  <div class="sg" style="border-top:1px solid #eee;padding-top:12px;margin-top:8px">
    <label style="margin-bottom:10px;font-size:13px;color:#333">警告提示设置</label>
    <div class="sg" style="padding-left:8px">
      <label>剩余多少分钟提示检查答题卡</label>
      <input type="number" id="ss_checkMin" value="15" min="1" max="60" onchange="applySettings()">
    </div>
    <div class="sg" style="padding-left:8px">
      <label>剩余多少分钟显示考试即将结束</label>
      <input type="number" id="ss_endingMin" value="5" min="1" max="30" onchange="applySettings()">
    </div>
    <div class="sg" style="padding-left:8px">
      <label>剩余多少秒开始闪烁</label>
      <input type="number" id="ss_flashSec" value="5" min="1" max="60" onchange="applySettings()">
    </div>
    <div class="sg" style="padding-left:8px">
      <label><input type="checkbox" id="ss_showEndBtn" checked onchange="applySettings()"> 显示提前结束考试按钮</label>
    </div>
  </div>
  <button class="btn btn-sm" style="margin-top:15px" onclick="saveSettings()">保存设置</button>
  <button class="btn btn-sm btn-outline" style="margin-top:8px" onclick="resetSettings()">恢复默认</button>
</div>
<script>
var timer,examData=null;
var now=new Date();
var sH=now.getHours(),sM=now.getMinutes(),sS=0;
var currentMode='start';
var schedules=[];  // 考试日程数组
var editingItemIndex=-1;  // -1表示新增，>=0表示编辑

var defaultSettings={
    fontSize:120,fontColor:'#000000',bgColor:'#ffffff',position:'center',
    offsetX:0,offsetY:0,labelColor:'#666666',
    waitLabel:'等待考试开始',liveLabel:'考试进行中',
    showWait:true,showLive:true,showTime:true,showDur:true,
    showElapsed:true,showEndTime:false,showWarning:true,
    checkMin:15,endingMin:5,flashSec:5,showEndBtn:true
};

var ui=defaultSettings;

function loadSettings(){
    var saved=localStorage.getItem('exam_ui');
    if(saved){try{var p=JSON.parse(saved);ui={...defaultSettings,...p};}catch(e){ui={...defaultSettings};}}
}

function saveSettingsData(){
    localStorage.setItem('exam_ui',JSON.stringify(ui));
}

function applySettingsToFields(){
    document.getElementById('ss_fontSize').value=ui.fontSize;
    document.getElementById('ss_fontColor').value=ui.fontColor;
    document.getElementById('ss_bgColor').value=ui.bgColor;
    document.getElementById('ss_position').value=ui.position;
    document.getElementById('ss_offsetX').value=ui.offsetX;
    document.getElementById('ss_offsetY').value=ui.offsetY;
    document.getElementById('ss_labelColor').value=ui.labelColor;
    document.getElementById('ss_waitLabel').value=ui.waitLabel;
    document.getElementById('ss_liveLabel').value=ui.liveLabel;
    document.getElementById('ss_showWait').checked=ui.showWait;
    document.getElementById('ss_showLive').checked=ui.showLive;
    document.getElementById('ss_showTime').checked=ui.showTime;
    document.getElementById('ss_showDur').checked=ui.showDur;
    document.getElementById('ss_showElapsed').checked=ui.showElapsed;
    document.getElementById('ss_showEndTime').checked=ui.showEndTime;
    document.getElementById('ss_showWarning').checked=ui.showWarning;
    document.getElementById('ss_checkMin').value=ui.checkMin;
    document.getElementById('ss_endingMin').value=ui.endingMin;
    document.getElementById('ss_flashSec').value=ui.flashSec;
    document.getElementById('ss_showEndBtn').checked=ui.showEndBtn;
}

function applySettings(){
    ui.fontSize=parseInt(document.getElementById('ss_fontSize').value)||120;
    ui.fontColor=document.getElementById('ss_fontColor').value;
    ui.bgColor=document.getElementById('ss_bgColor').value;
    ui.position=document.getElementById('ss_position').value;
    ui.offsetX=parseInt(document.getElementById('ss_offsetX').value)||0;
    ui.offsetY=parseInt(document.getElementById('ss_offsetY').value)||0;
    ui.labelColor=document.getElementById('ss_labelColor').value;
    ui.waitLabel=document.getElementById('ss_waitLabel').value;
    ui.liveLabel=document.getElementById('ss_liveLabel').value;
    ui.showWait=document.getElementById('ss_showWait').checked;
    ui.showLive=document.getElementById('ss_showLive').checked;
    ui.showTime=document.getElementById('ss_showTime').checked;
    ui.showDur=document.getElementById('ss_showDur').checked;
    ui.showElapsed=document.getElementById('ss_showElapsed').checked;
    ui.showEndTime=document.getElementById('ss_showEndTime').checked;
    ui.showWarning=document.getElementById('ss_showWarning').checked;
    ui.checkMin=parseInt(document.getElementById('ss_checkMin').value)||15;
    ui.endingMin=parseInt(document.getElementById('ss_endingMin').value)||5;
    ui.flashSec=parseInt(document.getElementById('ss_flashSec').value)||5;
    ui.showEndBtn=document.getElementById('ss_showEndBtn').checked;
    
    document.body.style.backgroundColor=ui.bgColor;
    var cd=document.getElementById('countdownDisplay');
    var style=getPositionStyle();
    cd.style.left=style.left;cd.style.right=style.right;cd.style.top=style.top;cd.style.bottom=style.bottom;
    cd.style.transform=style.transform;
    if(examData)updateTimer();
}

function getPositionStyle(){
    var x=ui.offsetX,y=ui.offsetY;
    switch(ui.position){
        case 'center':return{left:'50%',top:'50%',right:'auto',bottom:'auto',transform:'translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px))'};
        case 'top':return{left:'50%',top:(20+y)+'px',right:'auto',bottom:'auto',transform:'translateX(-50%)'};
        case 'bottom':return{left:'50%',top:'auto',right:'auto',bottom:(20+y)+'px',transform:'translateX(-50%)'};
        case 'top-left':return{left:(20+x)+'px',top:(20+y)+'px',right:'auto',bottom:'auto',transform:'none'};
        case 'top-right':return{left:'auto',top:(20+y)+'px',right:(20+x)+'px',bottom:'auto',transform:'none'};
        case 'bottom-left':return{left:(20+x)+'px',top:'auto',right:'auto',bottom:(20+y)+'px',transform:'none'};
        case 'bottom-right':return{left:'auto',top:'auto',right:(20+x)+'px',bottom:(20+y)+'px',transform:'none'};
    }
    return{left:'50%',top:'50%',right:'auto',bottom:'auto',transform:'translate(-50%,-50%)'};
}

function saveSettings(){saveSettingsData();alert('设置已保存');}

function resetSettings(){
    ui={...defaultSettings};
    saveSettingsData();
    applySettingsToFields();
    applySettings();
}

function toggleSettings(){
    var p=document.getElementById('settingsPanel');
    p.style.display=p.style.display==='block'?'none':'block';
}

function buildSelect(id,max,init){
    var el=document.getElementById(id);
    if(!el)return;
    el.innerHTML='';
    for(var i=0;i<=max;i++){
        var o=document.createElement('option');
        o.value=i;
        o.textContent=i<10?'0'+i:''+i;
        if(i===init)o.selected=true;
        el.appendChild(o);
    }
}

function initSelects(){
    buildSelect('hSelect',23,sH);
    buildSelect('mSelect',59,sM);
    buildSelect('sSelect',59,sS);
    var eH=(sH+2)%24;
    buildSelect('ehSelect',23,eH);
    buildSelect('emSelect',59,sM);
    buildSelect('esSelect',59,sS);
    // 科目编辑
    buildSelect('itemH',23,9);
    buildSelect('itemM',59,0);
    buildSelect('itemEH',23,11);
    buildSelect('itemEM',59,30);
}

function switchMode(mode){
    currentMode=mode;
    document.getElementById('modeStartBtn').classList.toggle('active',mode==='start');
    document.getElementById('modeEndBtn').classList.toggle('active',mode==='end');
    document.getElementById('modeScheduleBtn').classList.toggle('active',mode==='schedule');
    document.getElementById('startTimeGroup').style.display=(mode==='start')?'block':'none';
    document.getElementById('endTimeGroup').style.display=(mode==='end')?'block':'none';
    document.getElementById('durationGroup').style.display=(mode==='schedule')?'none':'block';
    document.getElementById('scheduleGroup').style.display=(mode==='schedule')?'block':'none';
    document.getElementById('startBtn').style.display=(mode==='schedule')?'none':'block';
    if(mode==='schedule')renderScheduleSummary();
    updateDurationDisplay();
}

// 时长自动计算：开始时间 + 结束时间 -> 时长字符串
function computeDuration(startMs,endMs){
    var diff=endMs-startMs;
    if(diff<=0)return'--';
    var h=Math.floor(diff/3600000);
    var m=Math.floor((diff%3600000)/60000);
    var s=Math.floor((diff%60000)/1000);
    var parts=[];
    if(h>0)parts.push(h+'小时');
    if(m>0||h>0)parts.push(m+'分');
    parts.push(pad(s)+'秒');
    return parts.join('');
}

function updateDurationDisplay(){
    var display=document.getElementById('durationDisplay');
    if(!display)return;
    var now=new Date();
    var startTime,endTime;
    if(currentMode==='start'){
        sH=parseInt(document.getElementById('hSelect').value);
        sM=parseInt(document.getElementById('mSelect').value);
        sS=parseInt(document.getElementById('sSelect').value);
        startTime=new Date(now.getFullYear(),now.getMonth(),now.getDate(),sH,sM,sS,0).getTime();
        // 结束时间：默认+2小时
        endTime=startTime+2*3600000;
        display.textContent='开始 '+pad(sH)+':'+pad(sM)+':'+pad(sS)+' （结束时间默认为开始+2小时，请切换到"设置结束时间"调整）';
    }else if(currentMode==='end'){
        var eh=parseInt(document.getElementById('ehSelect').value);
        var em=parseInt(document.getElementById('emSelect').value);
        var es=parseInt(document.getElementById('esSelect').value);
        endTime=new Date(now.getFullYear(),now.getMonth(),now.getDate(),eh,em,es,0).getTime();
        var startNow=now.getTime();
        display.textContent=computeDuration(startNow,endTime)+'（从现在到结束时间 '+pad(eh)+':'+pad(em)+':'+pad(es)+'）';
    }else{
        display.textContent='--';
    }
}

function calcStart(){
    var now=new Date();
    var target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),sH,sM,sS,0);
    if(target.getTime()<=now.getTime()){
        target.setDate(target.getDate()+1);
    }
    return target.getTime();
}

function saveConfig(){
    var now=new Date();
    var startTime,endTime,name,totalSec;
    if(currentMode==='end'){
        var eh=parseInt(document.getElementById('ehSelect').value);
        var em=parseInt(document.getElementById('emSelect').value);
        var es=parseInt(document.getElementById('esSelect').value);
        endTime=new Date(now.getFullYear(),now.getMonth(),now.getDate(),eh,em,es,0);
        if(endTime.getTime()<=now.getTime()){
            endTime.setDate(endTime.getDate()+1);
        }
        startTime=now.getTime();
        var durMs=endTime.getTime()-startTime;
        if(durMs<=0){alert('结束时间必须晚于当前时间');return;}
        totalSec=Math.floor(durMs/1000);
        name='结束于 '+pad(eh)+':'+pad(em)+':'+pad(es);
    }else{
        sH=parseInt(document.getElementById('hSelect').value);
        sM=parseInt(document.getElementById('mSelect').value);
        sS=parseInt(document.getElementById('sSelect').value);
        startTime=calcStart();
        // 默认2小时（可通过切换模式调整结束时间）
        var defaultDurSec=2*3600;
        endTime=startTime+defaultDurSec*1000;
        totalSec=defaultDurSec;
        name='开始于 '+pad(sH)+':'+pad(sM)+':'+pad(sS);
    }
    examData={
        start:startTime,
        end:endTime,
        totalMin:Math.floor(totalSec/60),
        totalSec:totalSec,
        hour:sH,
        min:sM,
        sec:sS,
        name:name,
        mode:currentMode
    };
    localStorage.setItem('exam',JSON.stringify(examData));
    showCountdown();
}

function deleteConfig(){
    if(!confirm('确定要删除本次考试设置吗？'))return;
    localStorage.removeItem('exam');
    examData=null;
    if(timer)clearInterval(timer);
    document.getElementById('countdownDisplay').style.display='none';
    showConfig();
}

function endExamEarly(){
    if(!confirm('确定要提前结束考试吗？'))return;
    if(timer)clearInterval(timer);
    examData.end=Date.now();
    updateTimer();
}

function showConfig(){
    if(timer)clearInterval(timer);
    document.getElementById('config').style.display='block';
    document.getElementById('countdownDisplay').style.display='none';
    document.getElementById('countdownDisplay').innerHTML='';
    document.getElementById('backBtn').style.display='none';
    document.getElementById('settingsToggle').style.display='none';
    document.getElementById('settingsPanel').style.display='none';
    initSelects();
}

function showCountdown(){
    document.getElementById('config').style.display='none';
    document.getElementById('countdownDisplay').style.display='block';
    document.getElementById('backBtn').style.display='block';
    document.getElementById('settingsToggle').style.display='block';
    document.body.style.backgroundColor=ui.bgColor;
    applySettingsToFields();
    applySettings();
    if(timer)clearInterval(timer);
    updateTimer();
    timer=setInterval(updateTimer,1000);
}

function pad(n){return n<10?'0'+n:n}

function updateTimer(){
    if(!examData)return;
    var now=Date.now(),diff=examData.start-now;
    var cd=document.getElementById('countdownDisplay');
    var style=getPositionStyle();
    var html='<div style="text-align:center">';

    if(diff>0){
        var h=Math.floor(diff/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
        var timeStr=pad(examData.hour)+':'+pad(examData.min)+':'+pad(examData.sec||0);
        if(ui.showWait)html+='<div class="status-badge status-wait">'+ui.waitLabel+'</div>';
        html+='<div class="countdown-time" style="font-size:'+ui.fontSize+'px;color:'+ui.fontColor+'">'+pad(h)+':'+pad(m)+':'+pad(s)+'</div>';
        var info='';
        if(ui.showTime)info+='<div class="exam-info" style="color:'+ui.labelColor+'">考试时间 <span style="color:'+ui.fontColor+'">'+timeStr+'</span></div>';
        if(ui.showDur)info+='<div class="exam-info" style="color:'+ui.labelColor+'">考试时长 <span style="color:'+ui.fontColor+'">'+examData.totalMin+' 分钟</span></div>';
        if(info)html+='<div>'+info+'</div>';
    }else if(now<examData.end){
        var remain=examData.end-now;
        var rh=Math.floor(remain/3600000),rm=Math.floor((remain%3600000)/60000),rs=Math.floor((remain%60000)/1000);
        var elapsedMs=now-examData.start;
        var elapsed=Math.floor(elapsedMs/60000);
        var elapsedSec=Math.floor((elapsedMs%60000)/1000);
        var remainSec=Math.round(remain/1000);
        var wt='';
        if(remainSec<=ui.flashSec){
            wt='考试即将结束！';
        }else if(Math.round(remain/60000)<=ui.endingMin){
            wt='考试即将结束！';
        }else if(Math.round(remain/60000)<=ui.checkMin){
            wt='还剩'+Math.ceil(remain/60000)+'分钟，请检查是否已将答题内容涂到答题卡上！';
        }
        if(ui.showLive)html+='<div class="status-badge status-live">'+ui.liveLabel+'</div>';
        if(examData.name)html+='<div style="font-size:24px;font-weight:bold;margin-bottom:8px;color:'+ui.fontColor+'">'+escapeHtml(examData.name)+'</div>';
        var timerColor=ui.fontColor;
        var timerExtra='';
        if(remainSec<=ui.flashSec){
            timerColor='#f85149';
            timerExtra=';animation:blink 0.5s infinite';
        }
        var timerStyle='font-size:'+ui.fontSize+'px;color:'+timerColor+timerExtra;
        html+='<div class="examing-timer" style="'+timerStyle+'">'+pad(rh)+':'+pad(rm)+':'+pad(rs)+'</div>';
        var inProgress=examData&&Date.now()>=examData.start&&Date.now()<examData.end;
        if(inProgress&&ui.showEndBtn){
            html+='<div style="margin-top:20px"><button class="btn" style="background:#c00;max-width:250px;margin:0 auto" onclick="endExamEarly()">提前结束考试</button></div>';
        }
        if(wt&&ui.showWarning)html+='<div style="margin-top:10px;font-size:18px;font-weight:bold;color:'+ui.fontColor+'">'+wt+'</div>';
        var info='';
        if(ui.showElapsed)info+='<div class="exam-info" style="color:'+ui.labelColor+'">已用时 <span style="color:'+ui.fontColor+'">'+elapsed+' 分 '+pad(elapsedSec)+' 秒</span></div>';
        if(ui.showDur)info+='<div class="exam-info" style="color:'+ui.labelColor+'">考试时长 <span style="color:'+ui.fontColor+'">'+examData.totalMin+' 分钟</span></div>';
        if(ui.showEndTime)info+='<div class="exam-info" style="color:'+ui.labelColor+'">结束时间 <span style="color:'+ui.fontColor+'">'+new Date(examData.end).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</span></div>';
        if(info)html+='<div style="margin-top:8px">'+info+'</div>';
    }else{
        html+='<div style="font-size:24px;font-weight:bold;color:'+ui.fontColor+';margin-bottom:15px">考试已结束</div>';
        if(ui.showDur)html+='<div class="exam-info" style="color:'+ui.labelColor+'">考试时长 <span style="color:'+ui.fontColor+'">'+examData.totalMin+' 分钟</span></div>';
        html+='<div class="action-row" style="max-width:400px;width:90%;margin:20px auto 0">'+
            '<button class="btn" onclick="deleteConfig()">删除考试</button>'+
            '<button class="btn btn-outline" onclick="showConfig()">重新设置</button>'+
        '</div>';
    }
    html+='</div>';
    cd.innerHTML=html;
}

function loadConfig(){
    var saved=localStorage.getItem('exam');
    if(saved){
        examData=JSON.parse(saved);
        showCountdown();
    }
}

function loadSchedules(){
    var saved=localStorage.getItem('exam_schedules');
    if(saved){
        try{schedules=JSON.parse(saved)||[];}catch(e){schedules=[];}
    }
}

function saveSchedules(){
    localStorage.setItem('exam_schedules',JSON.stringify(schedules));
}

function renderScheduleSummary(){
    var el=document.getElementById('scheduleSummary');
    if(!el)return;
    if(schedules.length===0){
        el.innerHTML='<div style="color:#999;text-align:center;padding:10px">暂无日程，请点击"编辑日程"添加</div>';
        return;
    }
    // 按日期+开始时间排序
    var sorted=schedules.slice().sort(function(a,b){
        if(a.date!==b.date)return a.date<b.date?-1:1;
        return(a.startH*60+a.startM)-(b.startH*60+b.startM);
    });
    var html='<div style="font-weight:bold;margin-bottom:5px">共 '+sorted.length+' 场考试</div>';
    var lastDate='';
    for(var i=0;i<sorted.length;i++){
        var s=sorted[i];
        if(s.date!==lastDate){
            html+='<div style="margin-top:6px;font-weight:bold;border-bottom:1px solid #ccc;padding-bottom:2px">'+s.date+'</div>';
            lastDate=s.date;
        }
        html+='<div style="padding-left:10px">'+s.name+' <span style="color:#666">'+pad(s.startH)+':'+pad(s.startM)+' - '+pad(s.endH)+':'+pad(s.endM)+'</span></div>';
    }
    el.innerHTML=html;
}

function openScheduleEditor(){
    document.getElementById('config').style.display='none';
    document.getElementById('scheduleEditor').style.display='block';
    document.getElementById('itemEditor').style.display='none';
    renderScheduleList();
}

function closeScheduleEditor(){
    document.getElementById('config').style.display='block';
    document.getElementById('scheduleEditor').style.display='none';
    document.getElementById('itemEditor').style.display='none';
    renderScheduleSummary();
}

function renderScheduleList(){
    var el=document.getElementById('scheduleList');
    if(!el)return;
    if(schedules.length===0){
        el.innerHTML='<div class="schedule-empty">暂无科目，点击下方"添加科目"开始</div>';
        return;
    }
    var sorted=schedules.slice().sort(function(a,b){
        if(a.date!==b.date)return a.date<b.date?-1:1;
        return(a.startH*60+a.startM)-(b.startH*60+b.startM);
    });
    var html='';
    for(var i=0;i<sorted.length;i++){
        var s=sorted[i];
        var realIdx=schedules.indexOf(s);
        html+='<div class="schedule-item">'+
            '<div class="schedule-item-info">'+
                '<div class="schedule-item-name">'+escapeHtml(s.name)+'</div>'+
                '<div class="schedule-item-time">'+s.date+' '+pad(s.startH)+':'+pad(s.startM)+' - '+pad(s.endH)+':'+pad(s.endM)+'</div>'+
            '</div>'+
            '<div class="schedule-item-actions">'+
                '<button class="schedule-item-btn" onclick="editScheduleItem('+realIdx+')">编辑</button>'+
                '<button class="schedule-item-btn danger" onclick="deleteScheduleItem('+realIdx+')">删除</button>'+
            '</div>'+
        '</div>';
    }
    el.innerHTML=html;
}

function escapeHtml(str){
    var div=document.createElement('div');
    div.textContent=str;
    return div.innerHTML;
}

function addScheduleItem(){
    editingItemIndex=-1;
    document.getElementById('itemEditorTitle').textContent='添加科目';
    document.getElementById('itemName').value='';
    var today=new Date();
    var dateStr=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
    document.getElementById('itemDate').value=dateStr;
    document.getElementById('itemH').value='9';
    document.getElementById('itemM').value='0';
    document.getElementById('itemEH').value='11';
    document.getElementById('itemEM').value='30';
    updateItemDuration();
    document.getElementById('scheduleEditor').style.display='none';
    document.getElementById('itemEditor').style.display='block';
}

function editScheduleItem(idx){
    editingItemIndex=idx;
    var s=schedules[idx];
    document.getElementById('itemEditorTitle').textContent='编辑科目';
    document.getElementById('itemName').value=s.name;
    document.getElementById('itemDate').value=s.date;
    document.getElementById('itemH').value=s.startH;
    document.getElementById('itemM').value=s.startM;
    document.getElementById('itemEH').value=s.endH;
    document.getElementById('itemEM').value=s.endM;
    updateItemDuration();
    document.getElementById('scheduleEditor').style.display='none';
    document.getElementById('itemEditor').style.display='block';
}

function cancelItemEdit(){
    document.getElementById('itemEditor').style.display='none';
    document.getElementById('scheduleEditor').style.display='block';
}

function updateItemDuration(){
    var sh=parseInt(document.getElementById('itemH').value);
    var sm=parseInt(document.getElementById('itemM').value);
    var eh=parseInt(document.getElementById('itemEH').value);
    var em=parseInt(document.getElementById('itemEM').value);
    var startMin=sh*60+sm;
    var endMin=eh*60+em;
    var diff=endMin-startMin;
    var el=document.getElementById('itemDuration');
    if(diff<=0){
        el.textContent='结束时间必须晚于开始时间';
        el.style.color='#c00';
        return;
    }
    el.style.color='#000';
    var h=Math.floor(diff/60);
    var m=diff%60;
    el.textContent=(h>0?h+'小时':'')+(m>0?m+'分钟':(h>0?'整':''));
    if(diff===0)el.textContent='--';
}

function saveScheduleItem(){
    var name=document.getElementById('itemName').value.trim();
    var date=document.getElementById('itemDate').value;
    var sh=parseInt(document.getElementById('itemH').value);
    var sm=parseInt(document.getElementById('itemM').value);
    var eh=parseInt(document.getElementById('itemEH').value);
    var em=parseInt(document.getElementById('itemEM').value);
    if(!name){alert('请输入科目名称');return;}
    if(!date){alert('请选择考试日期');return;}
    var startMin=sh*60+sm;
    var endMin=eh*60+em;
    if(endMin<=startMin){alert('结束时间必须晚于开始时间');return;}
    var item={name:name,date:date,startH:sh,startM:sm,endH:eh,endM:em};
    if(editingItemIndex>=0){
        schedules[editingItemIndex]=item;
    }else{
        schedules.push(item);
    }
    saveSchedules();
    cancelItemEdit();
    renderScheduleList();
}

function deleteScheduleItem(idx){
    if(!confirm('确定要删除"'+schedules[idx].name+'"吗？'))return;
    schedules.splice(idx,1);
    saveSchedules();
    renderScheduleList();
}

function startSchedule(){
    if(schedules.length===0){
        alert('请先添加考试日程');
        return;
    }
    // 找到下一场即将开始的考试
    var now=new Date();
    var nowMs=now.getTime();
    var todayStr=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
    var currentMin=now.getHours()*60+now.getMinutes();
    var candidates=[];
    for(var i=0;i<schedules.length;i++){
        var s=schedules[i];
        var startMs=parseScheduleTime(s,now,true);
        var endMs=parseScheduleTime(s,now,false);
        candidates.push({item:s,startMs:startMs,endMs:endMs});
    }
    // 排序：先看是否正在进行，再看时间
    candidates.sort(function(a,b){
        // 正在进行的优先
        var aIn=(nowMs>=a.startMs&&nowMs<a.endMs);
        var bIn=(nowMs>=b.startMs&&nowMs<b.endMs);
        if(aIn&&!bIn)return -1;
        if(bIn&&!aIn)return 1;
        // 否则按开始时间
        return a.startMs-b.startMs;
    });
    var target=candidates[0];
    if(!target){alert('没有可用的考试日程');return;}
    examData={
        start:target.startMs,
        end:target.endMs,
        totalMin:Math.floor((target.endMs-target.startMs)/60000),
        totalSec:Math.floor((target.endMs-target.startMs)/1000),
        hour:target.item.startH,
        min:target.item.startM,
        sec:0,
        name:target.item.name,
        date:target.item.date,
        mode:'schedule'
    };
    localStorage.setItem('exam',JSON.stringify(examData));
    showCountdown();
}

function parseScheduleTime(item,nowRef,isStart){
    var h=isStart?item.startH:item.endH;
    var m=isStart?item.startM:item.endM;
    var parts=item.date.split('-');
    var year=parseInt(parts[0]);
    var month=parseInt(parts[1])-1;
    var day=parseInt(parts[2]);
    var d=new Date(year,month,day,h,m,0,0);
    return d.getTime();
}

loadSettings();
initSelects();
loadSchedules();
updateDurationDisplay();
loadConfig();
</script>
</body>
