name: Flutter Build & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'client/**'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: client

      - name: Build Windows
        run: flutter build windows --release
        working-directory: client

      - name: Create Windows distribution
        run: |
          cd client\build\windows\x64\runner\Release
          Compress-Archive -Path * -DestinationPath "$env:GITHUB_WORKSPACE\rainbow_cloud_windows.zip" -Force
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rainbow_cloud_windows
          path: rainbow_cloud_windows.zip

  build-macos:
    name: Build macOS (ARM64 DMG)
    runs-on: macos-14  # Apple Silicon runner
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Verify ARM64 host
        run: |
          echo "Architecture: $(uname -m)"
          echo "Host: $(sw_vers -productVersion)"

      - name: Get dependencies
        run: flutter pub get
        working-directory: client

      - name: Build macOS (ARM64)
        run: |
          flutter config --no-analytics
          flutter build macos --release
        working-directory: client

      - name: Verify ARM64 binary
        run: |
          APP_PATH="client/build/macos/Build/Products/Release/rainbow_cloud.app"
          BIN="$APP_PATH/Contents/MacOS/rainbow_cloud"
          echo "Binary architectures:"
          file "$BIN"
          lipo -archs "$BIN"
          if ! lipo -archs "$BIN" | grep -q "arm64"; then
            echo "ERROR: Binary is not arm64"
            exit 1
          fi
          echo "ARM64 verified OK"

      - name: Apply ad-hoc code signing
        run: |
          APP_PATH="client/build/macos/Build/Products/Release/rainbow_cloud.app"
          echo "Applying ad-hoc signature..."
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --verbose=2 "$APP_PATH" || echo "Ad-hoc signature noted (will require Gatekeeper override on first run)"

      - name: Create DMG staging
        run: |
          STAGING="$GITHUB_WORKSPACE/dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "client/build/macos/Build/Products/Release/rainbow_cloud.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          ls -la "$STAGING"

      - name: Build ARM64 DMG
        run: |
          STAGING="$GITHUB_WORKSPACE/dmg-staging"
          DMG_PATH="$GITHUB_WORKSPACE/rainbow_cloud_arm64.dmg"
          rm -f "$DMG_PATH"
          hdiutil create \
            -volname "Rainbow Cloud" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            -fs HFS+ \
            "$DMG_PATH"
          echo "DMG created:"
          ls -la "$DMG_PATH"
          file "$DMG_PATH"

      - name: Verify DMG integrity
        run: |
          DMG_PATH="$GITHUB_WORKSPACE/rainbow_cloud_arm64.dmg"
          echo "Verifying DMG..."
          hdiutil verify "$DMG_PATH" || echo "verify failed, continuing"
          MOUNT_OUT=$(hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountrandom /tmp/dmg-mount 2>&1)
          echo "$MOUNT_OUT"
          MOUNT_POINT=$(echo "$MOUNT_OUT" | grep -oE '/tmp/dmg-mount\s*$' | awk '{print $1}' | head -1)
          if [ -d "$MOUNT_POINT" ]; then
            ls -la "$MOUNT_POINT"
            hdiutil detach "$MOUNT_POINT"
          else
            # Try to find mount point by other means
            DF_OUT=$(df | grep dmg-mount | tail -1 | awk '{print $NF}')
            if [ -n "$DF_OUT" ]; then
              ls -la "$DF_OUT"
              hdiutil detach "$DF_OUT"
            fi
          fi

      - name: Generate version tag
        id: macversion
        run: |
          DATETIME=$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M')
          echo "tag=v${DATETIME}" >> $GITHUB_OUTPUT
          echo "name=v${DATETIME}" >> $GITHUB_OUTPUT

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: rainbow_cloud_macos_dmg
          path: rainbow_cloud_arm64.dmg
          if-no-files-found: error

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: client

      - name: Build APK
        run: flutter build apk --release
        working-directory: client

      - name: Build App Bundle
        run: flutter build appbundle --release
        working-directory: client

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rainbow_cloud_android_apk
          path: client/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: rainbow_cloud_android_aab
          path: client/build/app/outputs/bundle/release/app-release.aab

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: rainbow_cloud_android_apk
          path: android_apk_dir
          merge-multiple: false

      - name: Locate Android APK
        run: |
          find android_apk_dir -name "*.apk" -type f -exec cp {} app-release.apk \;
          ls -la app-release.apk

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: rainbow_cloud_android_aab
          path: android_aab_dir
          merge-multiple: false

      - name: Locate Android AAB
        run: |
          find android_aab_dir -name "*.aab" -type f -exec cp {} app-release.aab \;
          ls -la app-release.aab

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rainbow_cloud_windows
          path: windows_dir
          merge-multiple: false

      - name: Locate Windows distribution
        run: |
          find windows_dir -name "rainbow_cloud_windows.zip" -type f -exec cp {} rainbow_cloud_windows.zip \; 2>/dev/null || echo "Windows artifact not available"
          ls -la rainbow_cloud_windows.zip 2>/dev/null || echo "No Windows zip"

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rainbow_cloud_macos_dmg
          path: macos_dmg_dir
          merge-multiple: false

      - name: Locate macOS DMG
        run: |
          find macos_dmg_dir -name "*.dmg" -type f -exec cp {} rainbow_cloud_arm64.dmg \; 2>/dev/null || echo "macOS DMG artifact not available"
          ls -la rainbow_cloud_arm64.dmg 2>/dev/null || echo "No macOS DMG"

      - name: Download macOS legacy zip artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rainbow_cloud_macos
          path: macos_dir
          merge-multiple: false

      - name: Locate macOS legacy zip
        run: |
          find macos_dir -name "rainbow_cloud_macos.zip" -type f -exec cp {} rainbow_cloud_macos.zip \; 2>/dev/null || echo "macOS legacy zip not available"
          ls -la rainbow_cloud_macos.zip 2>/dev/null || echo "No macOS legacy zip"

      - name: Generate version tag
        id: version
        run: |
          DATETIME=$(TZ='Asia/Shanghai' date +'%Y%m%d-%H%M')
          echo "tag=v${DATETIME}" >> $GITHUB_OUTPUT
          echo "name=v${DATETIME}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app-release.apk
            app-release.aab
            rainbow_cloud_windows.zip
            rainbow_cloud_arm64.dmg
            rainbow_cloud_macos.zip
