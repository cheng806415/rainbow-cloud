name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ==================== 构建 ====================

  build-android:
    name: Build Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: client

      - name: Build APK
        run: flutter build apk --release
        working-directory: client

      - name: Build App Bundle
        run: flutter build appbundle --release
        working-directory: client

      - name: Prepare artifacts
        run: |
          mkdir -p android-artifacts
          cp client/build/app/outputs/flutter-apk/app-release.apk android-artifacts/rainbow_cloud_${{ github.ref_name }}.apk
          cp client/build/app/outputs/bundle/release/app-release.aab android-artifacts/rainbow_cloud_${{ github.ref_name }}.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-artifacts/rainbow_cloud_${{ github.ref_name }}.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android-artifacts/rainbow_cloud_${{ github.ref_name }}.aab

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Add ATL include path
        shell: pwsh
        run: |
          $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $msvcDir = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($msvcDir) {
            $atlPath = Join-Path $msvcDir.FullName "atlmfc\include"
            if (Test-Path $atlPath) {
              Write-Output "ATL include path: $atlPath"
              "INCLUDE=$atlPath;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            } else {
              Write-Output "WARNING: ATL not found at $atlPath - trying VS installer"
              $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
              if (Test-Path $vsInstaller) {
                & $vsInstaller modify --installPath $vsPath --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart
                Write-Output "ATL component installed via VS installer"
              }
            }
          }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: client

      - name: Build Windows
        run: flutter build windows --release
        working-directory: client

      - name: Package Windows
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v',''
          cd client\build\windows\x64\runner\Release
          Compress-Archive -Path * -DestinationPath "$env:GITHUB_WORKSPACE\rainbow_cloud_windows_v$version.zip" -Force
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: rainbow_cloud_windows_v*.zip

  build-macos:
    name: Build macOS (ARM64 DMG)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: client

      - name: Build macOS (ARM64)
        run: |
          flutter config --no-analytics
          flutter config --no-enable-swift-package-manager
          flutter build macos --release
        working-directory: client

      - name: Verify ARM64 binary
        run: |
          APP_PATH="client/build/macos/Build/Products/Release/rainbow_cloud.app"
          BIN="$APP_PATH/Contents/MacOS/rainbow_cloud"
          file "$BIN"
          if ! lipo -archs "$BIN" | grep -q "arm64"; then
            echo "ERROR: Binary is not arm64"
            exit 1
          fi

      - name: Code sign & create DMG
        run: |
          APP_PATH="client/build/macos/Build/Products/Release/rainbow_cloud.app"
          codesign --force --deep --sign - "$APP_PATH"
          
          STAGING="$GITHUB_WORKSPACE/dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_PATH="$GITHUB_WORKSPACE/rainbow_cloud_macos_v${VERSION}.dmg"
          hdiutil create \
            -volname "Rainbow Cloud" \
            -srcfolder "$STAGING" \
            -ov -format UDZO -fs HFS+ \
            "$DMG_PATH"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: rainbow_cloud_macos_v*.dmg

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .
        working-directory: client

      - name: Get dependencies
        run: flutter pub get
        working-directory: client

      - name: Build Linux
        run: flutter build linux --release
        working-directory: client

      - name: Package Linux
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd client/build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/rainbow_cloud_linux_v${VERSION}.tar.gz" .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: rainbow_cloud_linux_v*.tar.gz

  # ==================== 发布：服务端 ====================

  release-server:
    name: Release Server (PHP)
    needs: [build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create server source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -r "dist/rainbow_cloud_server_v${VERSION}.zip" \
            admin/ assets/ file/ includes/ install/ \
            ajax.php api.php config.php down.php file.php index.php \
            login.php pdfview.php player.php upload.php user_center.php view.php \
            favicon.ico .user.ini \
            CHANGELOG.md LICENSE README.md \
            -x "*.git*" "*.log" "install/install.lock" "assets/js/layer.js"

      - name: Create Server Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-${{ github.ref_name }}
          name: "Rainbow Cloud ${{ github.ref_name }} - Server"
          body: |
            ## 彩虹外链网盘 - PHP 服务端

            版本：v${{ github.ref_name }}

            ### 环境要求
            - PHP >= 7.1
            - MySQL >= 5.5

            ### 安装方法
            1. 解压上传至网站根目录
            2. 访问网站，按照安装向导完成配置
            3. 默认后台：admin / 123456

            ### 更新日志
            详见 [CHANGELOG.md](https://github.com/cheng806415/rainbow-cloud/blob/main/CHANGELOG.md)
          draft: false
          prerelease: false
          files: dist/rainbow_cloud_server_v*.zip

  # ==================== 发布：Android ====================

  release-android:
    name: Release Android
    needs: [build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk

      - uses: actions/download-artifact@v4
        with:
          name: android-aab

      - name: List artifacts
        run: ls -la

      - name: Create Android Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.ref_name }}
          name: "Rainbow Cloud ${{ github.ref_name }} - Android"
          body: |
            ## 彩虹外链网盘 - Android 客户端

            版本：v${{ github.ref_name }}

            ### 安装说明
            - 下载 APK 文件安装到 Android 设备
            - 首次启动需配置服务器地址
            - 最低要求：Android 6.0 (API 23)

            ### 文件说明
            | 文件 | 用途 |
            |------|------|
            | APK | 直接安装包 |
            | AAB | Google Play 上传包 |
          draft: false
          prerelease: false
          files: |
            rainbow_cloud_*.apk
            rainbow_cloud_*.aab

  # ==================== 发布：Windows ====================

  release-windows:
    name: Release Windows
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-zip

      - name: List artifacts
        run: ls -la 2>/dev/null || echo "No Windows artifact"

      - name: Create Windows Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: windows-${{ github.ref_name }}
          name: "Rainbow Cloud ${{ github.ref_name }} - Windows"
          body: |
            ## 彩虹外链网盘 - Windows 客户端

            版本：v${{ github.ref_name }}

            ### 安装说明
            1. 解压 zip 文件
            2. 运行 `rainbow_cloud.exe`
            3. 首次启动需配置服务器地址
          draft: false
          prerelease: false
          files: rainbow_cloud_windows_v*.zip

  # ==================== 发布：macOS ====================

  release-macos:
    name: Release macOS
    needs: [build-macos]
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-dmg

      - name: List artifacts
        run: ls -la 2>/dev/null || echo "No macOS artifact"

      - name: Create macOS Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: macos-${{ github.ref_name }}
          name: "Rainbow Cloud ${{ github.ref_name }} - macOS"
          body: |
            ## 彩虹外链网盘 - macOS 客户端

            版本：v${{ github.ref_name }}

            ### 系统要求
            - macOS 12.0+
            - Apple Silicon (M1/M2/M3/M4) 芯片

            ### 安装说明
            1. 打开 DMG 文件
            2. 将 `rainbow_cloud.app` 拖入 Applications 文件夹
            3. 首次启动需配置服务器地址
            4. 如提示"无法验证开发者"，前往「系统设置 → 隐私与安全性」点击"仍要打开"
          draft: false
          prerelease: false
          files: rainbow_cloud_macos_v*.dmg

  # ==================== 发布：Linux ====================

  release-linux:
    name: Release Linux
    needs: [build-linux]
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-tar

      - name: List artifacts
        run: ls -la 2>/dev/null || echo "No Linux artifact"

      - name: Create Linux Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: linux-${{ github.ref_name }}
          name: "Rainbow Cloud ${{ github.ref_name }} - Linux"
          body: |
            ## 彩虹外链网盘 - Linux 客户端

            版本：v${{ github.ref_name }}

            ### 系统要求
            - 64 位 Linux 桌面环境
            - GTK 3

            ### 安装说明
            1. 解压 tar.gz 文件
            2. 运行 `rainbow_cloud`
            3. 首次启动需配置服务器地址
          draft: false
          prerelease: false
          files: rainbow_cloud_linux_v*.tar.gz